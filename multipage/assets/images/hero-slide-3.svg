<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1328" role="img" aria-label="Illustration of a technician with a tablet inspecting a turbofan engine with measurement callouts and a checklist">
  <defs>
    <linearGradient id="workshop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2238"/>
      <stop offset="1" stop-color="#2a527a"/>
    </linearGradient>
    <linearGradient id="nacelle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8eef2"/>
      <stop offset="1" stop-color="#8fa6b5"/>
    </linearGradient>
    <linearGradient id="spinner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d9ad"/>
      <stop offset="1" stop-color="#8b652e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".62" cy=".45" r=".6">
      <stop offset="0" stop-color="#f5d9ad" stop-opacity=".16"/>
      <stop offset="1" stop-color="#f5d9ad" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="engine-vignette" cx=".5" cy=".45" r=".75">
      <stop offset=".6" stop-color="#06121f" stop-opacity="0"/>
      <stop offset="1" stop-color="#06121f" stop-opacity=".45"/>
    </radialGradient>
    <pattern id="dots" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="3" fill="#ffffff" opacity=".07"/>
    </pattern>
    <path id="blade" d="M1250 336 C1224 372 1212 462 1216 560 L1284 560 C1288 462 1276 372 1250 336 Z"/>
  </defs>

  <rect width="2000" height="1328" fill="url(#workshop)"/>
  <rect x="0" y="0" width="1150" height="900" fill="url(#dots)"/>
  <rect width="2000" height="1328" fill="url(#glow)"/>

  <!-- Turbofan engine -->
  <g>
    <circle cx="1250" cy="664" r="560" fill="url(#nacelle)"/>
    <circle cx="1250" cy="664" r="560" fill="none" stroke="#dce8ee" stroke-width="12" opacity=".55"/>
    <circle cx="1250" cy="664" r="466" fill="#1d4266"/>
    <circle cx="1250" cy="664" r="396" fill="#0b2238"/>
    <g fill="#35618a">
      <use href="#blade"/>
      <use href="#blade" transform="rotate(30 1250 664)"/>
      <use href="#blade" transform="rotate(60 1250 664)"/>
      <use href="#blade" transform="rotate(90 1250 664)"/>
      <use href="#blade" transform="rotate(120 1250 664)"/>
      <use href="#blade" transform="rotate(150 1250 664)"/>
      <use href="#blade" transform="rotate(180 1250 664)"/>
      <use href="#blade" transform="rotate(210 1250 664)"/>
      <use href="#blade" transform="rotate(240 1250 664)"/>
      <use href="#blade" transform="rotate(270 1250 664)"/>
      <use href="#blade" transform="rotate(300 1250 664)"/>
      <use href="#blade" transform="rotate(330 1250 664)"/>
    </g>
    <circle cx="1250" cy="664" r="112" fill="url(#spinner)"/>
    <path d="M1250 664 L1362 664 A 112 112 0 0 0 1250 552 Z" fill="#ffe3ae" opacity=".45"/>
    <path d="M1210 610 A 82 82 0 0 1 1250 596" fill="none" stroke="#765421" stroke-width="9" stroke-linecap="round" opacity=".7"/>
    <circle cx="1250" cy="664" r="20" fill="#765421"/>
    <circle cx="1250" cy="664" r="505" fill="none" stroke="#0b2238" stroke-width="4" stroke-dasharray="5 16" opacity=".35"/>
    <g stroke="#0b2238" stroke-width="5" opacity=".28">
      <line x1="1250" y1="202" x2="1250" y2="104"/>
      <line x1="1250" y1="1126" x2="1250" y2="1224"/>
      <line x1="788" y1="664" x2="690" y2="664"/>
      <line x1="1712" y1="664" x2="1810" y2="664"/>
    </g>
    <path d="M836 348 A 555 555 0 0 1 1180 110" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity=".38"/>
  </g>

  <!-- Measurement callouts -->
  <g stroke="#edc68b" fill="none" stroke-width="5">
    <line x1="742" y1="404" x2="540" y2="340"/>
    <circle cx="742" cy="404" r="20" fill="#0b2238"/>
    <path d="M733 404 L740 413 L753 395" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="512" y="318" width="44" height="44" transform="rotate(45 534 340)" fill="#0b2238"/>
    <line x1="700" y1="664" x2="470" y2="664"/>
    <circle cx="700" cy="664" r="20" fill="#0b2238"/>
    <path d="M691 664 L698 673 L711 655" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="442" y="642" width="44" height="44" transform="rotate(45 464 664)" fill="#0b2238"/>
  </g>

  <!-- Inspection checklist -->
  <g transform="translate(-160 -40) rotate(-6 400 1060)">
    <rect x="250" y="960" width="310" height="206" rx="18" fill="#f7f5ee" stroke="#d9ae72" stroke-width="6"/>
    <rect x="365" y="942" width="80" height="36" rx="12" fill="#b6c7d3"/>
    <g stroke="#8b652e" stroke-width="5" fill="none">
      <circle cx="304" cy="1022" r="17"/>
      <circle cx="304" cy="1066" r="17"/>
      <circle cx="304" cy="1110" r="17"/>
    </g>
    <g stroke="#765421" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M296 1022 L302 1030 L314 1014"/>
      <path d="M296 1066 L302 1074 L314 1058"/>
    </g>
    <g fill="#b6c7d3">
      <rect x="340" y="1010" width="168" height="16" rx="8"/>
      <rect x="340" y="1054" width="168" height="16" rx="8"/>
      <rect x="340" y="1098" width="120" height="16" rx="8"/>
    </g>
  </g>

  <!-- Technician with tablet -->
  <g>
    <ellipse cx="472" cy="1186" rx="190" ry="30" fill="#06121f" opacity=".4"/>
    <rect x="290" y="1158" width="400" height="28" rx="12" fill="#0b2238"/>
    <line x1="416" y1="1156" x2="430" y2="1014" stroke="#0b2238" stroke-width="38" stroke-linecap="round"/>
    <line x1="492" y1="1156" x2="478" y2="1014" stroke="#0b2238" stroke-width="38" stroke-linecap="round"/>
    <rect x="398" y="866" width="112" height="160" rx="46" fill="#12314e"/>
    <rect x="404" y="930" width="100" height="14" rx="7" fill="#edc68b" opacity=".9"/>
    <rect x="404" y="962" width="100" height="9" rx="4" fill="#edc68b" opacity=".55"/>
    <line x1="426" y1="912" x2="500" y2="852" stroke="#0b2238" stroke-width="26" stroke-linecap="round"/>
    <g transform="rotate(10 560 880)">
      <rect x="500" y="836" width="132" height="92" rx="12" fill="#16354f" stroke="#edc68b" stroke-width="6"/>
      <rect x="514" y="850" width="104" height="64" rx="6" fill="#f5d9ad" opacity=".92"/>
      <path d="M528 884 L578 884 M528 902 L562 902" stroke="#765421" stroke-width="8" stroke-linecap="round"/>
    </g>
    <circle cx="452" cy="798" r="40" fill="#12314e"/>
    <path d="M412 792 A 40 40 0 0 1 492 792 Z" fill="#edc68b"/>
    <rect x="404" y="786" width="96" height="13" rx="6" fill="#d9ae72"/>
    <circle cx="1228" cy="638" r="34" fill="#ffe3ae" opacity=".5"/>
  </g>

  <rect width="2000" height="1328" fill="url(#engine-vignette)"/>
</svg>

